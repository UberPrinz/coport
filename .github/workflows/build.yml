# coport: Restrict CI to Lint + macOS arm64 ad-hoc builds and publish tag releases without upstream secrets or Sentry uploads.
name: Package-Build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  Lint:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Check upstream diff whitelist
      run: node scripts/coport/check-upstream-diff.mjs

    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev
        npm i -g yarn
        cd app
        yarn
        cd ..
        rm app/node_modules/.yarn-integrity
        yarn

    - name: Test SSH TERM
      run: yarn run test:ssh-term

    - name: Unit tests
      run: yarn run test:unit

    - name: Test Coport serial profiles
      run: node --experimental-strip-types --test scripts/coport/sim/serial-profiles.test.mjs

    - name: Build typings
      run: yarn run build:typings

    - name: Lint
      run: yarn run lint

  macOS-Build:
    runs-on: macos-15
    needs: Lint
    env:
      ARCH: arm64
      RUST_TARGET_TRIPLE: aarch64-apple-darwin

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - run: rustup target add aarch64-apple-darwin

    - name: Install deps
      run: yarn --network-timeout 1000000

    - name: Test Coport main-process units
      run: |
        node scripts/coport/sim/build-fixtures.mjs
        node --test scripts/coport/sim/serial-arbitration.test.cjs scripts/coport/sim/mcp-peer-uid.test.cjs

    - name: Webpack
      run: yarn run build

    - name: Prepackage plugins
      run: node scripts/prepackage-plugins.mjs

    - run: sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js

    # Work around electron-builder beta bug
    - run: ln -snf ../../node_modules/electron app/node_modules

    - name: Build and ad-hoc sign macOS packages
      run: node scripts/build-macos.mjs
      env:
        USE_HARD_LINKS: false

    - name: Verify signed bundle and checksums
      run: |
        codesign --verify --deep --strict dist/mac-arm64/Coport.app
        codesign --verify --strict dist/mac-arm64/Coport.app/Contents/MacOS/coport-mcp
        mkdir -p artifact-macos
        mv dist/*.dmg dist/*.zip artifact-macos/
        (cd artifact-macos && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
        cat artifact-macos/SHA256SUMS.txt

    - uses: actions/upload-artifact@v4
      name: Upload macOS packages
      with:
        name: Coport-macOS-arm64
        path: artifact-macos

  Release:
    runs-on: ubuntu-24.04
    needs: macOS-Build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download macOS packages
      uses: actions/download-artifact@v4
      with:
        name: Coport-macOS-arm64
        path: release-assets

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" release-assets/* --clobber
        else
          gh release create "$TAG" release-assets/* --generate-notes --title "Coport $TAG"
        fi
